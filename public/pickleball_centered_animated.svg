<svg id="still" xmlns="http://www.w3.org/2000/svg" font-family="SF Pro Display" font-weight="400" data-d-component="svg" fill="currentColor" style="background:transparent;color:#ededed" viewBox="-9.5 -39.5 340 220" width="100%" role="img" aria-label="Isometric pickleball court with two paddles rallying a ball" preserveAspectRatio="xMidYMid meet"><style>
#rally-ball { transform: translate(-69px, 15px); }
#rally-left, #rally-right { transform-box:fill-box; transform-origin: 50% 70%; }
#rally-left { transform: translate(3px,-1px) rotate(9deg); }
@media (prefers-reduced-motion: no-preference) {
  svg:not(:target) #rally-ball { animation: rally-flight 3.5s linear infinite; }
  svg:not(:target) #rally-left { animation: rally-left-swing 1.75s ease-in-out infinite; }
  svg:not(:target) #rally-right { animation: rally-right-swing 1.75s ease-in-out infinite; }
}
@keyframes rally-left-swing {
  0%,100% { transform:translate(3px,-1px) rotate(9deg); }
  7% { transform:translate(0,0) rotate(-4deg); }
  18%,76% { transform:translate(0,0) rotate(0deg); }
  90% { transform:translate(-4px,2px) rotate(-12deg); }
}
@keyframes rally-right-swing {
  0%,26%,76%,100% { transform:translate(0,0) rotate(0deg); }
  40% { transform:translate(4px,3px) rotate(-12deg); }
  50% { transform:translate(-3px,-2px) rotate(10deg); }
  57% { transform:translate(0,0) rotate(-4deg); }
}
